name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: linux, goarch: arm64, ext: "" }
          - { goos: darwin, goarch: amd64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build archives
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          commit="${GITHUB_SHA::7}"
          date="$(date -u +%Y-%m-%d)"
          ldflags="-s -w -X github.com/neko233-com/DownloadX/internal/version.Version=${version} -X github.com/neko233-com/DownloadX/internal/version.Commit=${commit} -X github.com/neko233-com/DownloadX/internal/version.Date=${date}"
          ext="${{ matrix.ext }}"
          mkdir -p dist
          go build -trimpath -tags=mygo_nowebview -ldflags "$ldflags" -o "dist/downloadx${ext}" ./cmd/downloadx
          go build -trimpath -tags=mygo_nowebview -ldflags "$ldflags" -o "dist/downloadx-gui${ext}" ./cmd/downloadx-gui
          cp README.md LICENSE dist/
          name="DownloadX_${version}_${{ matrix.goos }}_${{ matrix.goarch }}"
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -r "../${name}.zip" .
          else
            tar -czf "../${name}.tar.gz" .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: DownloadX_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            DownloadX_*.zip
            DownloadX_*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
